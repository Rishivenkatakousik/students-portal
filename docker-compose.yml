# docker compose up --build   ->   http://localhost:8080
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080" # reachable from this machine only
    environment:
      # Inside the compose network Postgres is "db" on its normal port.
      DATABASE_URL: postgresql+psycopg://results:results@db:5432/results
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      # Local development credentials only; not a secret.
      POSTGRES_USER: results
      POSTGRES_PASSWORD: results
      POSTGRES_DB: results
    ports:
      # For running the backend or tests from the host; 5433 avoids clashing with a local Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U results -d results"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
