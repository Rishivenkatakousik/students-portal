services:
  db:
    image: postgres:16-alpine
    environment:
      # Local development credentials only; not a secret.
      POSTGRES_USER: results
      POSTGRES_PASSWORD: results
      POSTGRES_DB: results
    ports:
      # Host port 5433 so it never clashes with a Postgres already on 5432.
      - "127.0.0.1:5433:5432" # reachable from this machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U results -d results"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
